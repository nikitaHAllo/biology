# ── HTTP → HTTPS редирект + certbot challenge ──────────────────────────────────
server {
    listen 80;
    server_name xn--80abvylehc.xn--p1ai admin.xn--80abvylehc.xn--p1ai;

    # Certbot использует этот путь при получении сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Основной сайт (Frontend + API) ────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name xn--80abvylehc.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80abvylehc.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80abvylehc.xn--p1ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    # API — проксируем на backend
    location /api {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend SPA
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
    }
}

# ── Админ-панель ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name admin.xn--80abvylehc.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80abvylehc.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80abvylehc.xn--p1ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
    }
}
